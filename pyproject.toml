[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "csi300-short-horizon-long-only-ranking"
version = "1.0.0"
description = "沪深300成分股短线多头选股：基于 Alpha158+28 与 LightGBM LambdaRank"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "baostock==0.8.9",
  "lightgbm==4.6.0",
  "numpy==1.26.4",
  "pandas==2.2.3",
  "pyarrow==19.0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

